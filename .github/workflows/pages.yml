name: Deploy Hub to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-manifests:
    name: Validate demos manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run manifest validator
        run: node tools/validate-manifests.mjs

  build:
    needs: validate-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          rm -rf .publish
          mkdir -p .publish

          # 构建 website/（如果存在）；否则纯 demos 部署
          if [ -d "website" ] && [ -f "website/package.json" ]; then
            echo ">>> Building website/"
            cd website
            npm ci
            npm run build
            cd ..
            if [ -d "website/dist" ]; then
              cp -r website/dist/. .publish/
            fi
          else
            echo ">>> No website/ yet, deploying demos only"
            # 留个空 index 避免根路径裸奔
            cat > .publish/index.html <<'EOF'
<!doctype html><meta charset="utf-8"><title>Hanmo Technology</title>
<h1>深圳市汉末科技有限公司</h1>
<p>网站正在建设中。已上线 Web 试玩：见 <code>/demos/</code> 子目录。</p>
EOF
          fi

          # 复制 demos/
          if [ -d "demos" ]; then
            echo ">>> Bundling demos/"
            cp -r demos .publish/
          fi

          # SPA 404 fallback（仅在 website/ 已构建且无自定义 404.html 时）
          if [ -f ".publish/index.html" ] && [ ! -f ".publish/404.html" ]; then
            cp .publish/index.html .publish/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
